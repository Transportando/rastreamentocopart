<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rastreamento Nacional GO</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,Helvetica,sans-serif;
}

body{
background:#f3f5f8;
padding:30px;
}

.container{
max-width:750px;
margin:auto;
background:#fff;
border-radius:18px;
box-shadow:0 8px 25px rgba(0,0,0,.12);
overflow:hidden;
}

.topo{
background:#0d4c8b;
color:#fff;
padding:25px;
text-align:center;
}

.topo h1{
font-size:28px;
}

.codigo{
margin-top:8px;
opacity:.9;
}

.status{
padding:25px;
text-align:center;
}

.status h2{
color:#0d4c8b;
margin-bottom:10px;
}

.barra{
height:14px;
background:#ddd;
border-radius:20px;
overflow:hidden;
margin:20px 0;
}

.progresso{
width:100%;
height:100%;
background:#2e7d32;
}

.rota{
display:flex;
justify-content:space-between;
padding:0 25px 25px;
font-weight:bold;
color:#444;
}

.timeline{
padding:0 25px 30px;
}

.item{
display:flex;
margin-bottom:18px;
}
.barra{
    width:100%;
    height:12px;
    background:#ddd;
    border-radius:10px;
    overflow:hidden;
}

.progresso{
    width:55%;
    height:100%;
    background:#2e7d32;
    border-radius:10px;
}
.texto{
color:#555;
}

.data{
font-size:13px;
color:#888;
margin-bottom:3px;
}

.rodape{
background:#f5f5f5;
padding:15px;
text-align:center;
font-size:13px;
color:#777;
}
</style>

</head>

<body>

<div class="container">

<div class="topo">
<h1>RASTREAMENTO NACIONAL GO</h1>
<div class="codigo">Código: NGO-587943621</div>
</div>

<div class="status">
<h2>EM TRÂNSITO</h2>

<div class="barra">
<div class="progresso"></div>
</div>

<p>Origem: São Paulo/SP</p>
<p>Destino: Montenegro/RS</p>
</div>

<div class="rota">
<span>São Paulo</span>
<span>➡</span>
<span>Minas Gerais</span>
</div>

<div class="timeline">

<div class="item">
  <div class="ponto"></div>
