
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Central de Liberação de Frota</title>

<style>
• {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
background: #f4f6fa;
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.card {
width: 100%;
max-width: 650px;
background: #fff;
border-radius: 20px;
padding: 40px;
box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
text-align: center;
}

.logo {
font-size: 28px;
font-weight: bold;
color: #0057b8;
margin-bottom: 8px;
}

.subtitulo {
color: #666;
margin-bottom: 30px;
}

.loader {
width: 90px;
height: 90px;
border: 8px solid #e0e0e0;
border-top: 8px solid #0057b8;
border-radius: 50%;
margin: 0 auto 25px;
animation: girar 1s linear infinite;
}

@keyframes girar {
from {
transform: rotate(0deg);
}
to {
transform: rotate(360deg);
}
}

.status {
font-size: 36px;
font-weight: bold;
color: #1f2937;
margin-bottom: 15px;
}

.mensagem {
color: #6b7280;
font-size: 18px;
line-height: 1.5;
margin-bottom: 30px;
}

.barra {
width: 100%;
height: 14px;
background: #e5e7eb;
border-radius: 20px;
overflow: hidden;
}

.progresso {
width: 78%;
height: 100%;
background: #0057b8;
border-radius: 20px;
}

.info {
margin-top: 25px;
color: #555;
line-height: 1.8;
}

@media (max-width: 600px) {
.card {
padding: 30px 20px;
}

.status {
font-size: 28px;
}

.mensagem {
font-size: 16px;
}

.logo {
font-size: 24px;
}
}
</style>
</head>

<body>

<main class="card">

<div class="logo">RASTREAMENTO COPART</div>

<div class="subtitulo">
Central de Monitoramento Logístico
</div>

<div class="loader" aria-label="Processando"></div>

<div class="status">
AGUARDANDO LIBERAÇÃO
</div>

<div class="mensagem">
Seu veículo encontra-se em processo administrativo de liberação para despacho.
</div>

<div class="barra" aria-label="Progresso de liberação">
<div class="progresso"></div>
</div>

<div class="info">
<b>Status Atual:</b> Aguardando Validação<br>
<b>Etapa:</b> Validação<br>
<b>Previsão de Saída:</b> 21/08/2026
</div>

</main>

</body>
</html>
